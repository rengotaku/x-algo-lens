  - id: F006
    name: 候補は最大経過時間で足切りされる
    stage: filter
    author_controllable: indirect
    direction: gate
    summary: >-
      投稿 ID から算出した経過時間が max_age を超える候補は除外される。
      経過時間を算出できない場合は unwrap_or(false) で「除外」に倒れる（fail-closed）。
      Phoenix パイプラインに配線されている AgeFilter には params::MAX_POST_AGE が渡されており、
      その値は 48 時間（48 * 60 * 60 秒）。
    evidence:
      - path: home-mixer/filters/age_filter.rs
        line: 16
        line_end: 20
        snippet: '.map(|age| age <= self.max_age)'
      - path: home-mixer/filters/age_filter.rs
        line: 16
        line_end: 20
        snippet: '.unwrap_or(false)'
      - path: home-mixer/params/config.rs
        line: 36
        snippet: 'pub const MAX_POST_AGE: u64 = 48 * 60 * 60;'
      - path: home-mixer/candidate_pipeline/phoenix_candidate_pipeline.rs
        line: 347
        snippet: 'Box::new(AgeFilter::new(Duration::from_secs(params::MAX_POST_AGE))),'
    confidence: high
    notes: >-
      当初この notes には「max_age の実値は確定できない」と書いていたが誤り。
      定数定義と AgeFilter への配線箇所の両方が公開されている（#8 で訂正）。
      なお AgeFilter 自体は max_age を引数に取る汎用フィルタなので、
      他のパイプラインに別の値で配線されている可能性は排除できない。

